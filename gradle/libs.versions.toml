[versions]
agp = "8.5.1"
kotlin = "1.9.0"
coreKtx = "1.13.1"
kotlinx = "1.8.1"
junit5 = "1.10.2.0"
jupiter = "5.10.2"
assertk = "0.28.1"
mockk = "1.13.12"
navigation = "2.7.7"
media3 = "1.8.0"
dokka = "1.9.20"
work = "2.9.1"
napier = "2.7.1"
license = "0.9.8"
mavenPublish = "0.30.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "jupiter" }
jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "jupiter" }
jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "jupiter" }
assertk = { group = "com.willowtreeapps.assertk", name = "assertk", version.ref = "assertk" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx" }
androidx-work = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
androidx-work-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
napier = { group = "io.github.aakira", name = "napier", version.ref = "napier"}

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
junit5 = { id = "de.mannodermaus.android-junit5", version.ref = "junit5" }
license = { id = "com.jaredsburrows.license", version.ref = "license" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
