# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Maven Central / POM metadata shared across all published modules.
# The vanniktech maven-publish plugin reads these properties automatically.
# Module-specific values (POM_ARTIFACT_ID, POM_NAME, POM_DESCRIPTION) are in
# each module's own gradle.properties.
# ---------------------------------------------------------------------------

GROUP=com.dolby.android.alps

# URL of the project's public website or repository (shown on Maven Central)
POM_URL=https://github.com/DolbyLaboratories/alps-android

# The open-source license the library is distributed under
POM_LICENSE_NAME=BSD 3-Clause License
POM_LICENSE_URL=https://github.com/DolbyLaboratories/alps-android/blob/release/LICENSE.md
# "repo" means the artifact is available from a Maven repository (standard value)
POM_LICENSE_DIST=repo

# Primary developer / maintainer of the library
POM_DEVELOPER_ID=dolby
POM_DEVELOPER_NAME=Dolby International AB
POM_DEVELOPER_EMAIL=alps@dolby.com

# Source Control Management links (required by Maven Central)
POM_SCM_URL=https://github.com/DolbyLaboratories/alps-android
POM_SCM_CONNECTION=scm:git:git://github.com/DolbyLaboratories/alps-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/DolbyLaboratories/alps-android.git
